description = 'Tilda Core - Base classes, utilities, and data access layer'

dependencies {
    // Database connection pooling
    implementation 'org.apache.commons:commons-dbcp2:2.12.0'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    
    // CSV processing
    implementation 'org.apache.commons:commons-csv:1.11.0'
    
    // Math utilities
    implementation 'org.apache.commons:commons-math3:3.6.1'
    
    // HTML parsing
    implementation 'org.jsoup:jsoup:1.17.2'
    
    // High-performance logging
    implementation 'com.lmax:disruptor:3.4.4'
    implementation 'org.apache.logging.log4j:log4j-web:2.23.1'
    
    // Scheduling
    implementation 'org.quartz-scheduler:quartz:2.3.2'
    implementation 'org.quartz-scheduler:quartz-jobs:2.3.2'
    
    // Email support
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'jakarta.activation:jakarta.activation-api:2.1.3'
    
    // NLP (optional - can be moved to separate module)
    implementation 'org.apache.opennlp:opennlp-tools:1.9.4'
    implementation 'org.apache.opennlp:opennlp-uima:1.9.4'
    
    // Temporary: Add missing dependencies that cause compilation errors
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    implementation files('../../lib/sqljdbc42.jar')
    implementation files('../../lib/GoogleBigQueryJDBC42.jar')
    
    // Add all GCP dependencies temporarily to resolve compilation
    implementation fileTree(dir: '../../lib/gcp', include: '*.jar')
}

// Source sets for the existing code structure
sourceSets {
    main {
        java {
            srcDirs = ['../../src']
            
            // Start with absolutely minimal set - only classes with no dependencies
            include 'tilda/utils/HttpStatus.java'           // Simple enum, no dependencies
            include 'tilda/utils/Counter.java'
            include 'tilda/utils/AnsiUtil.java'
            include 'tilda/utils/LongWrapper.java'
        include 'tilda/utils/ClassUtils.java'
        
        // Include simple pair classes
        include 'tilda/utils/pairs/StringStringPair.java'
        include 'tilda/utils/pairs/StringIntPair.java'
        include 'tilda/utils/pairs/IntIntPair.java'
            
            // Include basic interfaces with minimal dependencies
            include 'tilda/interfaces/JSONable.java'        // Basic interface
            include 'tilda/interfaces/CSVable.java'         // CSV export interface
            include 'tilda/interfaces/OCCObject.java'       // Optimistic concurrency control
            
            // Include simple enums with no dependencies
            include 'tilda/enums/TildaType.java'
            include 'tilda/enums/OrderType.java'
            include 'tilda/enums/OrderNulls.java'
            include 'tilda/enums/DBStringType.java'
            include 'tilda/enums/StatementType.java'
            include 'tilda/enums/JoinType.java'
            include 'tilda/enums/MultiType.java'
            include 'tilda/enums/TransactionType.java'
            include 'tilda/enums/DefaultType.java'
            include 'tilda/enums/TZMode.java'
            include 'tilda/enums/MigrationType.java'
            include 'tilda/enums/SyncStatus.java'
            include 'tilda/enums/ConventionNaming.java'
            include 'tilda/enums/OutputFormatType.java'
            include 'tilda/enums/ColumnMode.java'
            include 'tilda/enums/ObjectLifecycle.java'
            include 'tilda/enums/ObjectMode.java'
            include 'tilda/enums/ProtectionType.java'
            include 'tilda/enums/ValidationStatus.java'
            include 'tilda/enums/VisibilityType.java'
            
            // Basic database classes with minimal dependencies
            include 'tilda/db/InitMode.java'
            include 'tilda/db/ListResults.java'
            include 'tilda/db/LookupParams.java'
            
            // Exclude complex database code but allow basic classes
            exclude 'tilda/db/stores/**'                    // Database store implementations
            exclude 'tilda/db/processors/**'               // Database processors
            exclude 'tilda/db/metadata/**'                 // Database metadata
            exclude 'tilda/db/config/**'                   // Database configuration
            exclude 'tilda/db/Connection.java'             // Complex connection class
            exclude 'tilda/db/ConnectionPool.java'         // Connection pooling
            exclude 'tilda/db/QueryHelper.java'            // Complex query helper
            exclude 'tilda/db/JDBCHelper.java'             // JDBC utilities
            exclude 'tilda/types/**'                        // Type definitions have dependencies
            exclude 'tilda/parsing/**'                      // Parser code
            exclude 'tilda/generation/**'                   // Generator code
            exclude 'tilda/loader/**'                       // Loader code
            exclude 'tilda/data/**'                         // Generated data classes
            // Exclude specific utils that have dependencies (but allow HttpStatus)
            exclude 'tilda/utils/TextUtil.java'
            exclude 'tilda/utils/DateTimeUtil.java'
            exclude 'tilda/utils/SystemValues.java'
            exclude 'tilda/utils/CollectionUtil.java'
            exclude 'tilda/utils/FileUtil.java'
            exclude 'tilda/utils/NumberFormatUtil.java'
            exclude 'tilda/utils/ParseUtil.java'
            exclude 'tilda/utils/EncryptionUtil.java'
            exclude 'tilda/utils/DurationUtil.java'
            exclude 'tilda/utils/json/**'
            exclude 'tilda/enums/ColumnType.java'          // Has dependencies on utils
            exclude 'tilda/enums/DefaultType.java'         // Has dependencies
            exclude 'tilda/grammar/**'                     // ANTLR dependencies
            exclude 'tilda/interfaces/PatternObject.java'  // Has parsing dependencies
            
            // Exclude specific database implementations (go to their modules)
            exclude 'tilda/db/stores/PostgreSQL.java'      // Goes to tilda-postgres
            exclude 'tilda/db/stores/MSSQL.java'           // Goes to tilda-sqlserver
            exclude 'tilda/db/stores/BigQuery.java'        // Goes to tilda-bigquery
            exclude 'tilda/db/stores/IBMDB2.java.SAVED'    // Legacy file
            
            // Exclude utility modules
            exclude 'tilda/Export.java'      // Export utility goes to tilda-export
            exclude 'tilda/migration/**'     // Migration code goes to tilda-migration
            exclude 'tilda/Gen.java'         // CLI goes to tilda-cli
            exclude 'tilda/servlet/**'       // Web code goes to tilda-web
            exclude 'tilda/web/**'           // Web code goes to tilda-web
            exclude 'tilda/rest/**'          // Web code goes to tilda-web
            exclude 'tilda/gcp/**'           // GCP code goes to tilda-gcp
            exclude 'tilda/cloud/**'         // Cloud code goes to tilda-gcp
        }
        resources {
            srcDirs = ['../../src']
            include '**/*.properties'
            include '**/*.xml'
            include '**/*.json'
            exclude '**/web/**'
            exclude '**/servlet/**'
        }
    }
    
    test {
        java {
            srcDirs = ['../../ut']
            exclude '**/db/stores/**'
            exclude '**/web/**'
            exclude '**/servlet/**'
            exclude '**/gcp/**'
            exclude '**/cloud/**'
        }
    }
}

// Compilation options to handle legacy code issues
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-Xlint:-unchecked',     // Suppress unchecked cast warnings
        '-Xlint:-deprecation',   // Suppress deprecation warnings
        '-Xlint:-rawtypes',      // Suppress raw types warnings
        '-Xmaxerrs', '50'        // Show more errors to understand issues
    ]
    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx1g']
    
    // Enable error checking now that we have a working baseline
    options.failOnError = true
}

// Custom task to copy existing source files to module structure (migration helper)
task migrateSourceFiles {
    group = 'migration'
    description = 'Copy existing source files to modular structure'
    doLast {
        println 'This task will help migrate existing source files to the new modular structure'
        println 'Run this after setting up all modules'
    }
}

// Task to check what files are being compiled
task listSourceFiles {
    group = 'debug'
    description = 'List all source files being compiled'
    doLast {
        sourceSets.main.java.srcDirs.each { dir ->
            if (dir.exists()) {
                println "Source directory: $dir"
                fileTree(dir).include('**/*.java').each { file ->
                    println "  - ${file.path}"
                }
            }
        }
    }
}
