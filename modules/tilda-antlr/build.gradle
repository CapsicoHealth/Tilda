description = 'Tilda ANTLR - Grammar parsing and code generation'

dependencies {
    api project(':tilda-core')
    
    // ANTLR runtime and tools
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    implementation 'org.antlr:antlr4:4.13.1'
    
    // Additional external dependencies identified by analyzer
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
}

// Source sets for ANTLR-specific code
sourceSets {
    main {
        java {
            srcDirs = ['../../src-antlr4']
            // For now, only include generated ANTLR files from src-antlr4
            // All grammar source files have complex dependencies that need to be resolved
        }
    }
}

// ANTLR code generation task
task generateGrammar(type: JavaExec) {
    group = 'antlr'
    description = 'Generate ANTLR grammar files'
    classpath = configurations.runtimeClasspath
    mainClass = 'org.antlr.v4.Tool'
    args = ['-visitor', '-package', 'tilda.grammar', 'src/main/antlr4/Tilda.g4']
}
